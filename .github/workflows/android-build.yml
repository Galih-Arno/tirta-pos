name: Build and Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Assets (Vite)
        run: npm run build

      - name: Sync Capacitor to Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # Ubah Nama File APK Menjadi TirtaPerkasa.apk
      - name: Rename APK File
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/TirtaPerkasa.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tirta-Pos-Offline
          path: build-output/TirtaPerkasa.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/TirtaPerkasa.apk
          name: Release ${{ github.ref_name }}
          body: |
            ### 🚀 Pembaruan Aplikasi Tirta Perkasa POS (${{ github.ref_name }})
            
            - Berkas **TirtaPerkasa.apk** siap diunduh dan mendukung fitur **In-App Auto Update**.
            - Silakan unduh file di bawah ini untuk memperbarui sistem kasir.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
