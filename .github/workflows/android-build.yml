name: Build and Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Assets (Vite)
        run: npm run build

      - name: Sync Capacitor to Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # Simpan Artefak sebagai cadangan di tab Actions
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tirta-Pos-Offline
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Buat GitHub Release Otomatis HANYA saat Push Tag (misal: v1.2.0)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: Release ${{ github.ref_name }}
          body: |
            ### 🚀 Pembaruan Aplikasi Tirta POS (${{ github.ref_name }})
            
            - Berkas APK siap digunakan dan mendukung fitur **In-App Auto Update**.
            - Silakan unduh `app-debug.apk` di bawah ini untuk memperbarui aplikasi di tablet/HP kasir.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
