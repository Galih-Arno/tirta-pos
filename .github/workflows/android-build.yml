name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download Gradle Binary with Auto-Retry
        run: |
          mkdir -p android/gradle/wrapper
          curl --retry 5 --retry-delay 5 -sSL -o android/gradle/wrapper/gradle-8.11.1-bin.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          sed -i 's|distributionUrl=.*|distributionUrl=gradle-8.11.1-bin.zip|g' android/gradle/wrapper/gradle-wrapper.properties

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets (Vite dist)
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tirta-Pos-Offline
          path: android/app/build/outputs/apk/debug/app-debug.apk
