<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Tirta POS - Keygen Generator Developer</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: white; padding: 40px; display: flex; justify-content: center; }
    .card { background: #1e293b; padding: 24px; border-radius: 12px; width: 400px; border: 1px solid #334155; }
    input { width: 100%; padding: 10px; margin-top: 8px; margin-bottom: 16px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #f59e0b; font-weight: bold; font-family: monospace; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #f59e0b; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
    .result { margin-top: 16px; padding: 12px; background: #064e3b; color: #34d399; font-family: monospace; font-size: 18px; text-align: center; font-weight: bold; border-radius: 6px; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Generator Lisensi Client</h2>
    <label>Kode ID Perangkat Client:</label>
    <input type="text" id="devId" placeholder="Contoh: TRT-89AC-F412-991A">
    <button onclick="generate()">Generate Serial Key</button>
    <div id="output" class="result"></div>
  </div>

  <script>
    function generate() {
      const deviceId = document.getElementById('devId').value.trim();
      if (!deviceId) return alert("Masukkan Device ID!");
      
      const cleanId = deviceId.replace(/[^A-Z0-9]/g, '');
      let hash = 0;
      const salt = "TIRTA_PERKASA_SECRET_2026";
      const combined = cleanId + salt;
      
      for (let i = 0; i < combined.length; i++) {
        hash = ((hash << 5) - hash) + combined.charCodeAt(i);
        hash = hash & hash;
      }
      
      const posHash = Math.abs(hash).toString(16).padStart(8, '0').toUpperCase();
      const serialKey = `LIC-${posHash.substring(0, 4)}-${posHash.substring(4, 8)}`;
      
      const outDiv = document.getElementById('output');
      outDiv.innerText = serialKey;
      outDiv.style.display = 'block';
    }
  </script>
</body>
</html>
